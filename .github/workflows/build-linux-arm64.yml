name: Build Linux arm64

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to existing release?'
        type: boolean
        default: true
        required: false

permissions:
  contents: write

jobs:
  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-24.04-arm
    env:
      RUST_TARGET: aarch64-unknown-linux-gnu
      ARTIFACT_NAME: linux-arm64-bundles
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (Linux arm64)
        run: npm run tauri build -- --target "$RUST_TARGET"

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/deb/*.deb
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  release-linux-arm64:
    name: Upload Linux arm64 to Release
    needs: [build-linux-arm64]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'release' && github.event.action == 'published')
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.upload_release == 'true')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'linux-arm64-bundles'
          path: release-artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_PREFIX: linux-arm64
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Uploading Linux arm64 assets to tag: $TAG"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          mapfile -d '' ASSETS < <(find release-artifacts -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' \
          \) -print0)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No Linux arm64 release assets were found."
            find release-artifacts -maxdepth 4 -type f -print
            exit 1
          fi

          mkdir -p upload-assets
          for f in "${ASSETS[@]}"; do
            cp "$f" "upload-assets/${UPLOAD_PREFIX}-$(basename "$f")"
          done

          for f in upload-assets/*; do
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
