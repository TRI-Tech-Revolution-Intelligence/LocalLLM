name: Build macOS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to existing release?'
        type: boolean
        default: true
        required: false

permissions:
  contents: write

jobs:
  build-macos-x64:
    name: Build macOS (x64)
    runs-on: macos-15-intel
    env:
      RUST_TARGET: x86_64-apple-darwin
      PI_TARGET_TRIPLE: x86_64-apple-darwin
      ARTIFACT_NAME: macos-x64-bundles
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (macOS x64)
        run: npm run tauri build -- --target "$RUST_TARGET"
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/dmg/*.dmg

  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-15
    env:
      RUST_TARGET: aarch64-apple-darwin
      PI_TARGET_TRIPLE: aarch64-apple-darwin
      ARTIFACT_NAME: macos-arm64-bundles
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (macOS arm64)
        run: npm run tauri build -- --target "$RUST_TARGET"
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/dmg/*.dmg

  release-macos:
    name: Upload macOS to Release
    needs: [build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'release' && github.event.action == 'published')
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.upload_release == 'true')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'macos-*-bundles'
          path: release-artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Uploading macOS assets to tag: $TAG"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          mkdir -p upload-assets
          if [ -d "release-artifacts/macos-x64-bundles" ]; then
            mapfile -d '' ASSETS_X64 < <(find release-artifacts/macos-x64-bundles -type f -name '*.dmg' -print0)
            for f in "${ASSETS_X64[@]}"; do
              cp "$f" "upload-assets/macos-x64-$(basename "$f")"
            done
          fi
          if [ -d "release-artifacts/macos-arm64-bundles" ]; then
            mapfile -d '' ASSETS_ARM64 < <(find release-artifacts/macos-arm64-bundles -type f -name '*.dmg' -print0)
            for f in "${ASSETS_ARM64[@]}"; do
              cp "$f" "upload-assets/macos-arm64-$(basename "$f")"
            done
          fi

          for f in upload-assets/*; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
