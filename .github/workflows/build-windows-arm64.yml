name: Build Windows arm64

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to existing release?'
        type: boolean
        default: true
        required: false

permissions:
  contents: write

jobs:
  build-windows-arm64:
    name: Build Windows arm64
    runs-on: windows-11-arm
    env:
      RUST_TARGET: aarch64-pc-windows-msvc
      PI_TARGET_TRIPLE: aarch64-pc-windows-msvc
      ARTIFACT_NAME: windows-arm64-bundles
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (Windows arm64)
        run: npm run tauri build -- --target "$env:RUST_TARGET"

      - name: Upload Windows arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ env.RUST_TARGET }}/release/*.exe
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/msi/*.msi
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/nsis/*.exe

  release-windows-arm64:
    name: Upload Windows arm64 to Release
    needs: [build-windows-arm64]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'release' && github.event.action == 'published')
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.upload_release == 'true')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'windows-arm64-bundles'
          path: release-artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_PREFIX: windows-arm64
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Uploading Windows arm64 assets to tag: $TAG"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          mapfile -d '' ASSETS < <(find release-artifacts -type f \( \
            -name '*.msi' -o \
            -name '*.exe' \
          \) -print0)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No Windows arm64 release assets were found."
            find release-artifacts -maxdepth 4 -type f -print
            exit 1
          fi

          mkdir -p upload-assets
          for f in "${ASSETS[@]}"; do
            cp "$f" "upload-assets/${UPLOAD_PREFIX}-$(basename "$f")"
          done

          for f in upload-assets/*; do
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
