name: Build & Release macOS ARM

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to existing release?'
        type: boolean
        default: true
        required: false

permissions:
  contents: write

jobs:
  build-macos-arm:
    name: Build macOS ARM
    runs-on: macos-latest
    env:
      RUST_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (macOS ARM)
        run: npm run tauri build -- --target "$RUST_TARGET"
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-bundles
          path: |
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg

  release-macos-arm:
    name: Upload macOS ARM to Release
    needs: [build-macos-arm]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'release' && github.event.action == 'published')
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.upload_release == 'true')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'macos-arm-bundles'
          path: release-artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Uploading macOS ARM assets to tag: $TAG"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          mapfile -d '' ASSETS < <(find release-artifacts -type f -name '*.dmg' -print0)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No macOS ARM release assets were found."
            find release-artifacts -maxdepth 4 -type f -print
            exit 1
          fi

          for f in "${ASSETS[@]}"; do
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
