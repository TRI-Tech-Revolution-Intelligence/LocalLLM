name: Build Linux

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to existing release?'
        type: boolean
        default: true
        required: false

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    env:
      RUST_TARGET: x86_64-unknown-linux-gnu
      PI_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      ARTIFACT_NAME: linux-x64-bundles
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            build-essential \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (Linux x64)
        run: npm run tauri build -- --target "$RUST_TARGET" --bundles deb,rpm

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/deb/*.deb
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/rpm/*.rpm

  build-linux-arm64:
    name: Build Linux (arm64)
    runs-on: ubuntu-22.04-arm
    env:
      RUST_TARGET: aarch64-unknown-linux-gnu
      PI_TARGET_TRIPLE: aarch64-unknown-linux-gnu
      ARTIFACT_NAME: linux-arm64-bundles
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            build-essential \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (Linux arm64)
        run: npm run tauri build -- --target "$RUST_TARGET" --bundles deb,rpm

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/deb/*.deb
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/rpm/*.rpm

  release-linux:
    name: Upload Linux to Release
    needs: [build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'release' && github.event.action == 'published')
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.upload_release == 'true')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'linux-*-bundles'
          path: release-artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Uploading Linux assets to tag: $TAG"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          mkdir -p upload-assets
          if [ -d "release-artifacts/linux-x64-bundles" ]; then
            mapfile -d '' ASSETS_X64 < <(find release-artifacts/linux-x64-bundles -type f \( -name '*.deb' -o -name '*.rpm' \) -print0)
            for f in "${ASSETS_X64[@]}"; do
              cp "$f" "upload-assets/linux-x64-$(basename "$f")"
            done
          fi
          if [ -d "release-artifacts/linux-arm64-bundles" ]; then
            mapfile -d '' ASSETS_ARM64 < <(find release-artifacts/linux-arm64-bundles -type f \( -name '*.deb' -o -name '*.rpm' \) -print0)
            for f in "${ASSETS_ARM64[@]}"; do
              cp "$f" "upload-assets/linux-arm64-$(basename "$f")"
            done
          fi

          for f in upload-assets/*; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
